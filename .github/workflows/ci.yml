name: FitTrack CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend/app
      - name: Import API application
        working-directory: backend
        env:
          SESSION_SECRET: ci-test-secret-with-more-than-thirty-two-characters
        run: python -c "from app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Report installed frontend dependencies
        working-directory: frontend
        run: npm ls --depth=0
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --json > npm-audit.json || true; cat npm-audit.json
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
